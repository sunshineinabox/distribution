# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
version: 1
kind: CompositeDevice
name: AYANEO Pocket Air Mini

options:
  auto_manage: true

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: compatible
          value: ayaneo,pocket-air-mini

source_devices:
  - group: gamepad
    evdev:
      name: Pocket Air Mini Buttons
      handler: event*
    capability_map_id: ayaneo_pocket_air_mini

  - group: gamepad
    evdev:
      name: gamepad-joystick
      handler: event*
    capability_map_id: ayaneo_pocket_air_mini

target_devices:
  - ds5
