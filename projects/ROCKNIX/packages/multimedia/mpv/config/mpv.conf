# Hardware decode. v4l2request must be named explicitly (mpv's auto is a
# safe-whitelist that skips it). Direct first: under the vulkan renderer
# libplacebo imports the decoder's DRM_PRIME dmabufs zero-copy (verified on
# RG-DS: 'VO: gpu-next 1920x1080 drm_prime[nv12]'). -copy is the fallback
# (and the working path under GLES, whose blob EGL rejects per-plane
# import); auto covers platforms with other paths (vaapi on AMD64).
hwdec=v4l2request,v4l2request-copy,auto

# The drmprime interop needs a DRM node and defaults to renderD128, which
# does not exist where the GPU runs a non-DRM kernel driver (Mali kbase
# blobs). The KMS primary node exists everywhere and is sufficient.
drm-device=/dev/dri/card0

# Vulkan renders AND is the zero-copy lane on Mali blobs (the WSI-layer
# maintenance1 fix made swapchains work; the pl dmabuf interop imports what
# blob EGL cannot). GLES remains available via --gpu-api=opengl.
gpu-api=vulkan
