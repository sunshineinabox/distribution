# v4l2request is not in mpv's auto whitelist, so try direct, then copy, then auto
hwdec=v4l2request,v4l2request-copy,auto

# renderD128 does not exist on Mali kbase blobs, the KMS primary node does
drm-device=/dev/dri/card0

# vulkan imports the decoder's dmabufs zero-copy, GLES stays available via --gpu-api=opengl
gpu-api=vulkan
