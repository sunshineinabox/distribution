# HiFi verb for AYANEO Pocket Air Mini
#   Speakers:    DL1 -> ADDA -> MT6359 DAC L/R -> HP -> 2 one-wire amps (hw:,0)
#   Headphones:  DL1 -> ADDA -> MT6359 DAC L/R -> HP                     (hw:,0)
#   Mic:         UL1 <- ADDA_UL   <- MT6359 PGA_L <- AIN0             (hw:,2)
#   Headset Mic: UL1 <- ADDA_UL   <- MT6359 PGA_L <- AIN1             (hw:,2)

SectionVerb {
	EnableSequence [
		cset "name='DAC In Mux' Normal Path"
		cset "name='ADDA_DL_CH1 DL1_CH1' 1"
		cset "name='ADDA_DL_CH2 DL1_CH2' 1"
		cset "name='UL_SRC_MUX' AMIC"
		cset "name='MISO0_MUX' UL1_CH1"
		cset "name='MISO1_MUX' UL1_CH1"
		cset "name='ADC_L_Mux' Left Preamplifier"
		cset "name='UL1_CH1 ADDA_UL_CH1' 1"
		cset "name='UL1_CH2 ADDA_UL_CH1' 1"
	]

	DisableSequence [
		cset "name='UL1_CH1 ADDA_UL_CH1' 0"
		cset "name='UL1_CH2 ADDA_UL_CH1' 0"
		cset "name='ADC_L_Mux' Idle"
		cset "name='ADDA_DL_CH1 DL1_CH1' 0"
		cset "name='ADDA_DL_CH2 DL1_CH2' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='HP Mux' Audio Playback"
		cset "name='Speakers Switch' 1"
	]

	DisableSequence [
		cset "name='Speakers Switch' 0"
		cset "name='HP Mux' Open"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	EnableSequence [
		cset "name='PGA_L_Mux' AIN0"
		cset "name='Internal Mic Switch' 1"
	]

	DisableSequence [
		cset "name='Internal Mic Switch' 0"
		cset "name='PGA_L_Mux' None"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
		CaptureRate 48000
	}
}

# Without jack detection the headphones would always win
If.jack {
	Condition {
		Type ControlExists
		Control "iface=CARD,name='Headphone Jack'"
	}
	True {
		SectionDevice."Headphones" {
			Comment "Headphones"

			ConflictingDevice [
				"Speaker"
			]

			EnableSequence [
				cset "name='HP Mux' Audio Playback"
				cset "name='Headphone Jack Switch' 1"
			]

			DisableSequence [
				cset "name='Headphone Jack Switch' 0"
				cset "name='HP Mux' Open"
			]

			Value {
				PlaybackPriority 200
				PlaybackPCM "hw:${CardId},0"
				PlaybackChannels 2
				PlaybackRate 48000
				JackControl "Headphone Jack"
				JackHWMute "Speaker"
			}
		}

		SectionDevice."Headset" {
			Comment "Headset Microphone"

			ConflictingDevice [
				"Mic"
			]

			EnableSequence [
				cset "name='PGA_L_Mux' AIN1"
				cset "name='Headset Mic Switch' 1"
			]

			DisableSequence [
				cset "name='Headset Mic Switch' 0"
				cset "name='PGA_L_Mux' None"
			]

			Value {
				CapturePriority 200
				CapturePCM "hw:${CardId},2"
				CaptureChannels 2
				CaptureRate 48000
				JackControl "Headset Mic Jack"
			}
		}
	}
}
