Syntax 4

# Use case configuration for AYANEO Pocket Air Mini (MT6785 + MT6359)

Comment "AYANEO Pocket Air Mini"

SectionUseCase."HiFi" {
	File "/MediaTek/mt6785/PocketAirMini-HiFi.conf"
	Comment "Speakers, headphones and microphones"
}

# MT6359 gain codes run backwards, 8 is 0 dB
BootSequence [
	cset "name='Headset Volume' 8"
	cset "name='PGA1 Volume' 2"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
