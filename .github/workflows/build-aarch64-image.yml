name: Build image

on:
  workflow_call:
    inputs:
      PROJECT:
        required: true
        type: string
      DEVICE:
        required: true
        type: string
      OWNER_LC:
        required: true
        type: string
      NIGHTLY:
        description: "build nightly version"
        type: string
        required: true
      OFFICIAL:
        description: "build official version"
        type: string
        required: true

jobs:
  build-aarch64-image:
    runs-on: ubuntu-24.04
    env:
      JAVA_HOME: /usr
      AUTOREMOVE: "yes"
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      ARCH: aarch64
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
      CHEEVOS_DEV_LOGIN: ${{ secrets.CHEEVOS_DEV_LOGIN }}
      GAMESDB_APIKEY: ${{ secrets.GAMESDB_APIKEY }}
      SCREENSCRAPER_DEV_LOGIN: ${{ secrets.SCREENSCRAPER_DEV_LOGIN }}
      NIGHTLY: ${{ inputs.NIGHTLY }}
      OFFICIAL: ${{ inputs.OFFICIAL }}
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download arm (${{ inputs.DEVICE }})
        if: ${{ inputs.DEVICE != 'SM8650' && inputs.DEVICE != 'SM8750' }}
        uses: actions/download-artifact@v8
        with:
          name: arm (${{ inputs.DEVICE }})

      - name: Extract artifact arm
        if: ${{ inputs.DEVICE != 'SM8650' && inputs.DEVICE != 'SM8750' }}
        run: |
          tar --zstd -xf build.arm.tar.zst

      - name: Clean up compressed arm file
        if: ${{ inputs.DEVICE != 'SM8650' && inputs.DEVICE != 'SM8750' }}
        run: rm build.arm.tar.zst
        
      - name: Download emu-libretro (${{ inputs.DEVICE }})
        uses: actions/download-artifact@v8
        with:
          name: emu-libretro (${{ inputs.DEVICE }})

      - name: Extract artifact emu-libretro
        run: |
          cat build.emu-libretro.tar.zst.part* > build.emu-libretro.tar.zst
          tar --zstd -xf build.emu-libretro.tar.zst

      - name: Clean up compressed emu-libretro file
        run: rm build.emu-libretro.tar*

      - name: Download emu-standalone (${{ inputs.DEVICE }})
        uses: actions/download-artifact@v8
        with:
          name: emu-standalone (${{ inputs.DEVICE }})

      - name: Extract artifact emu-standalone
        run: |
          cat build.emu-standalone.tar.zst.part* > build.emu-standalone.tar.zst
          tar --skip-old-files --zstd -xf build.emu-standalone.tar.zst

      - name: Clean up compressed emu-standalone file
        run: rm build.emu-standalone.tar*

      # clean to rebuild retroarch with 32bit enabled
      - name: Clean retroarch
        run: |
          ./scripts/get_env > .env
          docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
            bash -c "./scripts/clean retroarch"
      # clean to rebuild emulationstation with credentials
      - name: Clean emulationstation
        run: |
          ./scripts/get_env > .env
          docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
            bash -c "./scripts/clean emulationstation"

      - name: build
        run: |
          ./scripts/get_env > .env
          set -e
          { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
            bash -c "./scripts/build_distro"; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
          exit_code=$(<docker_exit_code)
          exit $exit_code

      - name: Archive output.logs (${{ inputs.DEVICE }}-aarch64-image)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs (${{ inputs.DEVICE }}-aarch64-image)
          path: |
            output.log
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Get date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          name: ROCKNIX-image-${{ inputs.DEVICE }}-${{ env.DATE }}
          path: |
            target/ROCKNIX-*.img.gz
            target/ROCKNIX-*.img.gz.sha256
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: ROCKNIX-update-${{ inputs.DEVICE }}-${{ env.DATE }}
          path: |
            target/ROCKNIX-*.tar
            target/ROCKNIX-*.tar.sha256
          compression-level: 0
          if-no-files-found: error

      # Persist the full build tree for the next nightly: this job is the only
      # one holding the union of every stage (base + qt6 + both emu sets), so
      # the tree saved here lets tomorrow's toolchain job restore it and every
      # stage stamp-skip all unchanged packages. Key must match the toolchain
      # workflow's "Tree cache key" step - global inputs only, stamps handle
      # per-package changes.
      - name: Tree cache key
        if: vars.DISABLE_TREE_CACHE != 'yes'
        id: treekey
        run: |
          DIGEST=$(docker image inspect --format '{{index .RepoDigests 0}}' "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest")
          TREE=$(git ls-files -s config scripts distributions \
                 "projects/${PROJECT}/devices/${DEVICE}/options" | sha256sum | cut -d' ' -f1)
          KEY=$(printf '%s %s' "${DIGEST}" "${TREE}" | sha256sum | cut -d' ' -f1)
          echo "key: ${KEY}"
          echo "key=${KEY}" >> $GITHUB_OUTPUT

      - name: Compress tree for cache
        if: vars.DISABLE_TREE_CACHE != 'yes'
        run: |
          NAME="tree-aarch64-${{ inputs.DEVICE }}"
          sudo tar -I 'zstd -T0' -cf - \
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain \
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/build \
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/install_* \
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.stamps | split -b 1900m - "${NAME}.tar.zst.part"
          SHA=$(cat ${NAME}.tar.zst.part* | sha256sum | cut -d' ' -f1)
          NPARTS=$(ls ${NAME}.tar.zst.part* | wc -l)
          echo "${{ steps.treekey.outputs.key }} ${SHA} ${NPARTS}" > "${NAME}.key"

      - name: Save tree cache
        if: vars.DISABLE_TREE_CACHE != 'yes'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: tree
          files: |
            tree-aarch64-${{ inputs.DEVICE }}.tar.zst.part*
            tree-aarch64-${{ inputs.DEVICE }}.key
          make_latest: false
          prerelease: true
          body: persisted build trees
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true
